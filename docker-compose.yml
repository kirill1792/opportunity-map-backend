services:
  postgres:
    image: postgres:16
    container_name: opportunity-map-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: opportunity_user
      POSTGRES_PASSWORD: opportunity_password
      POSTGRES_DB: opportunity_map
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: